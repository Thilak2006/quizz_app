<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>No Questions</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; font-family:'Poppins',sans-serif; }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #1e1a3a, #0f0c2c);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .card {
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(15px);
            border-radius: 50px;
            padding: 60px 40px;
            text-align: center;
            max-width: 600px;
            border: 1px solid rgba(255,255,255,0.1);
            box-shadow: 0 30px 60px rgba(0,0,0,0.5);
            animation: fadeInUp 1s ease;
        }

        @keyframes fadeInUp {
            from { opacity:0; transform:translateY(30px); }
            to { opacity:1; transform:translateY(0); }
        }

        .icon {
            font-size: 6rem;
            color: #f43f5e;
            filter: drop-shadow(0 0 20px #f43f5e);
            animation: shake 2s infinite;
        }

        @keyframes shake {
            0%,100% { transform: rotate(0); }
            10%,30%,50%,70%,90% { transform: rotate(-5deg); }
            20%,40%,60%,80% { transform: rotate(5deg); }
        }

        h2 {
            font-size: 3rem;
            font-weight: 700;
            background: linear-gradient(135deg, #f87171, #f43f5e);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin: 20px 0;
        }

        p {
            color: #b0b0ff;
            font-size: 1.2rem;
            margin: 20px 0;
            line-height: 1.6;
        }

        .btn {
            display: inline-block;
            padding: 16px 40px;
            background: linear-gradient(135deg, #a855f7, #3b82f6);
            color: white;
            font-weight: 600;
            border-radius: 40px;
            text-decoration: none;
            font-size: 1.2rem;
            margin-top: 20px;
            transition: 0.3s;
            border: none;
            cursor: pointer;
        }

        .btn:hover {
            transform: scale(1.1);
            box-shadow: 0 0 30px #a855f7;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon"><i class="fas fa-exclamation-triangle"></i></div>
        <h2>No Questions Left</h2>
        <p>We've run out of questions for this session.<br>Please try again later or add more questions.</p>
        <a href="{% url 'home' %}" class="btn"><i class="fas fa-home"></i> Return Home</a>
    </div>
</body>
</html>
