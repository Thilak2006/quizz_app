<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add a Question</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; font-family:'Poppins',sans-serif; }
        body {
            min-height: 100vh;
            background: radial-gradient(circle at 30% 30%, #1e1a3a, #0c0a1a);
            padding: 30px;
            color: #e0e0ff;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
        }
        .form-card {
            background: rgba(20,20,40,0.8);
            backdrop-filter: blur(15px);
            border-radius: 50px;
            border: 1px solid rgba(255,255,255,0.1);
            padding: 40px;
            box-shadow: 0 30px 60px rgba(0,0,0,0.6);
            animation: slideUp 0.6s ease;
        }
        @keyframes slideUp {
            from { opacity:0; transform:translateY(30px); }
            to { opacity:1; transform:translateY(0); }
        }
        h1 {
            font-size: 2.8rem;
            background: linear-gradient(135deg, #c084fc, #60a5fa);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom: 10px;
        }
        .subhead {
            color: #b0b0ff;
            margin-bottom: 30px;
        }
        .form-group {
            margin-bottom: 25px;
        }
        label {
            display: block;
            font-weight: 500;
            margin-bottom: 8px;
            color: #d0d0ff;
        }
        input, textarea, select {
            width: 100%;
            padding: 16px 20px;
            background: rgba(255,255,255,0.05);
            border: 2px solid rgba(255,255,255,0.1);
            border-radius: 30px;
            font-size: 1rem;
            color: white;
            transition: 0.3s;
        }
        input:focus, textarea:focus, select:focus {
            outline: none;
            border-color: #a855f7;
            background: rgba(255,255,255,0.1);
        }
        textarea {
            min-height: 100px;
            resize: vertical;
        }
        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        .btn {
            padding: 16px 40px;
            background: linear-gradient(135deg, #a855f7, #3b82f6);
            color: white;
            border: none;
            border-radius: 40px;
            font-weight: 600;
            font-size: 1.2rem;
            cursor: pointer;
            transition: 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 10px;
        }
        .btn:hover {
            transform: scale(1.02);
            box-shadow: 0 0 30px #a855f7;
        }
        .btn-secondary {
            background: transparent;
            border: 2px solid #a855f7;
        }
        .actions {
            display: flex;
            gap: 20px;
            margin-top: 30px;
            flex-wrap: wrap;
        }
        .messages {
            margin-bottom: 20px;
        }
        .message {
            padding: 15px 25px;
            border-radius: 30px;
            font-weight: 500;
        }
        .message.success {
            background: rgba(16,185,129,0.2);
            border: 1px solid #10b981;
            color: #d1fae5;
        }
        .message.error {
            background: rgba(239,68,68,0.2);
            border: 1px solid #ef4444;
            color: #fee2e2;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="form-card">
            <h1><i class="fas fa-plus-circle"></i> Contribute a Question</h1>
            <div class="subhead">Share your knowledge with the community</div>

            {% if messages %}
            <div class="messages">
                {% for message in messages %}
                <div class="message {{ message.tags }}">{{ message }}</div>
                {% endfor %}
            </div>
            {% endif %}

            <form method="post">
                {% csrf_token %}
                <div class="form-group">
                    <label for="topic">Topic</label>
                    <input type="text" id="topic" name="topic" list="topic-list" placeholder="e.g., Math, Science, History..." required>
                    <datalist id="topic-list">
                        {% for topic in topics %}
                        <option value="{{ topic }}">
                        {% endfor %}
                    </datalist>
                </div>

                <div class="form-group">
                    <label for="difficulty">Difficulty (0.0 – 1.0)</label>
                    <input type="number" id="difficulty" name="difficulty" step="0.1" min="0" max="1" value="0.5" required>
                </div>

                <div class="form-group">
                    <label for="text">Question Text</label>
                    <textarea id="text" name="text" placeholder="Enter your question..." required></textarea>
                </div>

                <div class="options-grid">
                    <div class="form-group">
                        <label for="option1">Option 1</label>
                        <input type="text" id="option1" name="option1" placeholder="First option" required>
                    </div>
                    <div class="form-group">
                        <label for="option2">Option 2</label>
                        <input type="text" id="option2" name="option2" placeholder="Second option" required>
                    </div>
                    <div class="form-group">
                        <label for="option3">Option 3</label>
                        <input type="text" id="option3" name="option3" placeholder="Third option" required>
                    </div>
                    <div class="form-group">
                        <label for="option4">Option 4</label>
                        <input type="text" id="option4" name="option4" placeholder="Fourth option" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="correct">Correct Answer</label>
                    <input type="text" id="correct" name="correct" placeholder="Exactly as one of the options" required>
                </div>

                <div class="form-group">
                    <label for="explanation">Explanation</label>
                    <textarea id="explanation" name="explanation" placeholder="Why is this answer correct?" required></textarea>
                </div>

                <div class="actions">
                    <button type="submit" class="btn"><i class="fas fa-save"></i> Save Question</button>
                    <a href="{% url 'home' %}" class="btn btn-secondary"><i class="fas fa-home"></i> Home</a>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
