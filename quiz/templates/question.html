<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Question {{ question_count }}/5</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; font-family:'Poppins',sans-serif; }

        body {
            min-height: 100vh;
            background: radial-gradient(circle at 30% 30%, #251c3a, #0c0a1a);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .quiz-container {
            max-width: 900px;
            width: 100%;
            background: rgba(20,20,40,0.7);
            backdrop-filter: blur(15px);
            border-radius: 50px;
            border: 1px solid rgba(255,255,255,0.1);
            padding: 40px;
            box-shadow: 0 30px 60px rgba(0,0,0,0.6);
            animation: slideUp 0.8s ease;
        }

        @keyframes slideUp {
            from { opacity:0; transform:translateY(50px); }
            to { opacity:1; transform:translateY(0); }
        }

        .progress-indicator {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .badge {
            background: rgba(168,85,247,0.2);
            padding: 10px 25px;
            border-radius: 40px;
            color: #c084fc;
            font-weight: 600;
            border: 1px solid #a855f7;
            backdrop-filter: blur(5px);
        }

        .badge i {
            margin-right: 8px;
        }

        .question-text {
            font-size: 2.2rem;
            font-weight: 700;
            color: white;
            margin: 30px 0 20px;
            line-height: 1.4;
        }

        .options-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin: 30px 0;
        }

        .option-card {
            background: rgba(255,255,255,0.03);
            border: 2px solid rgba(255,255,255,0.05);
            border-radius: 30px;
            padding: 25px;
            text-align: center;
            font-size: 1.3rem;
            font-weight: 500;
            color: #d0d0ff;
            cursor: pointer;
            transition: all 0.3s;
            user-select: none;
        }

        .option-card:hover {
            border-color: #a855f7;
            background: rgba(168,85,247,0.1);
            transform: scale(1.02);
            box-shadow: 0 10px 30px rgba(168,85,247,0.2);
        }

        .option-card.selected {
            border-color: #a855f7;
            background: rgba(168,85,247,0.2);
            box-shadow: 0 0 30px #a855f7;
            color: white;
        }

        .option-card input[type="radio"] {
            display: none;
        }

        .btn-submit {
            width: 100%;
            padding: 20px;
            background: linear-gradient(135deg, #a855f7, #3b82f6);
            border: none;
            border-radius: 60px;
            color: white;
            font-size: 1.5rem;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 30px;
        }

        .btn-submit:hover:not(:disabled) {
            transform: scale(1.02);
            box-shadow: 0 0 40px #a855f7;
        }

        .btn-submit:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .footer-note {
            text-align: center;
            margin-top: 20px;
            color: rgba(255,255,255,0.3);
        }
    </style>
</head>
<body>
    <div class="quiz-container">
        <div class="progress-indicator">
            <span class="badge"><i class="fas fa-tag"></i> {{ question.topic }}</span>
            <span class="badge"><i class="fas fa-signal"></i> Difficulty: {{ question.difficulty|floatformat:1 }}</span>
            <span class="badge"><i class="fas fa-question"></i> {{ question_count }}/5</span>
        </div>

        <div class="question-text">{{ question.text }}</div>

        <form id="quizForm" action="{% url 'process_answer' %}" method="post">
            {% csrf_token %}
            <div class="options-grid">
                {% for option in question.options %}
                <label class="option-card">
                    <input type="radio" name="response" value="{{ option }}" required>
                    {{ option }}
                </label>
                {% endfor %}
            </div>
            <button type="submit" class="btn-submit" id="submitBtn" disabled>
                <i class="fas fa-paper-plane"></i> Submit Answer
            </button>
        </form>

        <div class="footer-note">
            <i class="fas fa-lightbulb"></i> Select an option to continue
        </div>
    </div>

    <script>
        // Enable submit button only when an option is selected
        const radios = document.querySelectorAll('input[name="response"]');
        const submitBtn = document.getElementById('submitBtn');
        const optionCards = document.querySelectorAll('.option-card');

        radios.forEach(radio => {
            radio.addEventListener('change', function() {
                // Remove selected class from all cards
                optionCards.forEach(card => card.classList.remove('selected'));
                // Add selected class to the parent label of checked radio
                if (this.checked) {
                    this.closest('.option-card').classList.add('selected');
                    submitBtn.disabled = false;
                }
            });
        });

        // Also allow click on the whole card
        optionCards.forEach(card => {
            card.addEventListener('click', function(e) {
                const radio = this.querySelector('input[type="radio"]');
                radio.checked = true;
                // Trigger change event manually
                const event = new Event('change', { bubbles: true });
                radio.dispatchEvent(event);
            });
        });
    </script>
</body>
</html>
