<h1>{{ quiz.title }}</h1>

<form method="POST">
    {% csrf_token %}

    {% for question in quiz.question_set.all %}
        <p><strong>{{ question.text }}</strong></p>

        {% for option in question.option_set.all %}
            <input type="radio"
                   name="{{ question.id }}"
                   value="{{ option.id }}">
            {{ option.text }} <br>
        {% endfor %}

        <br>
    {% endfor %}

    <button type="submit">Submit</button>
</form>
